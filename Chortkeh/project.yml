name: Chortkeh
options:
  bundleIdPrefix: app.chortkeh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fa
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Chortkeh:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Domain
      - path: Infrastructure
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "چُرتکه"
        CFBundleName: "Chortkeh"
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSFaceIDUsageDescription: "چُرتکه برای قفل‌کردن اطلاعات مالی شما از Face ID استفاده می‌کند."
        NSContactsUsageDescription: "فقط برای انتخاب نام و شماره طرف حساب؛ اطلاعات مخاطبان از دستگاه خارج نمی‌شود."
        NSPhotoLibraryUsageDescription: "برای افزودن تصویر چک به‌صورت رمزگذاری‌شده روی همین دستگاه."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chortkeh.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

  ChortkehTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: Tests/Integration
    dependencies:
      - target: Chortkeh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.chortkeh.ios.tests

  ChortkehUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Chortkeh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.chortkeh.ios.uitests
        TEST_TARGET_NAME: Chortkeh

schemes:
  Chortkeh:
    build:
      targets:
        Chortkeh: all
        ChortkehTests: [test]
        ChortkehUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ChortkehTests
        - ChortkehUITests
