name: daily forecast

on:
  schedule:
    # 17:30 UTC (21:00 Tehran): after the LME settlement (Westmetall) and the day's IME session
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# own group: a shared group would let the 30-minute collector cancel this run while it waits
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-model.txt
      - name: forecast + backtest
        run: python run_forecast.py
        continue-on-error: true
      - name: commit & push
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m collector.gitsync "data: forecast $(date -u +%Y-%m-%d)"

  deploy:
    needs: forecast
    if: needs.forecast.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
