name: collect prices

on:
  schedule:
    # every 30 min Mon–Fri (UTC): LME, COMEX, SHFE + IME (Mon–Wed are trading days in Tehran)
    - cron: "*/30 * * * 1-5"
    # Sat/Sun around Tehran trading hours (08:30–14:00 Tehran = 05:00–10:30 UTC): IME only trades then
    - cron: "*/30 5-10 * * 0,6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "یک‌بار تاریخچه را پر کن (backfill.py)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: backfill (manual run only)
        if: ${{ inputs.backfill }}
        run: python backfill.py
        continue-on-error: true

      # the scripts never fail because a source failed; errors land in data/status.json
      - name: global prices
        run: python collect_global.py
        continue-on-error: true
      - name: Iran prices (may be blocked outside Iran; then use the local collector)
        run: python collect_iran.py --no-push
        continue-on-error: true

      - name: commit & push data
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m collector.gitsync "data: prices $(date -u +%Y-%m-%dT%H:%MZ)"

  # pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy from here
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
