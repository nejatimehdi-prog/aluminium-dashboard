name: weekly production and trade

on:
  schedule:
    # Mondays 05:00 UTC (08:30 Tehran); Codal monthly reports appear in the first ~10 days of a month
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# own group: a shared group would let the 30-minute collector cancel this run while it waits
concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: production + trade
        run: python collect_weekly.py
        continue-on-error: true
      - name: commit & push data
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m collector.gitsync "data: production and trade $(date -u +%Y-%m-%d)"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
